name: build

# The deploy workflow only runs on pushes to master, so until this existed nothing
# checked a pull request. A dependency bump could sit in review looking green while
# leaving unmet peers, or breaking the build outright, and nobody would know until it
# was already on docs.bitcr.org.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version is read from the packageManager field in package.json, so
      # CI, Dependabot and local corepack all run the same release. Dependabot
      # regenerating the lockfile with a different major is what silently dropped
      # the patchedDependencies block and broke the frozen install below.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile fails if package.json and the lockfile disagree.
      # --strict-peer-dependencies fails on unmet peers, which is what catches a
      # partial upgrade: bumping a theme without bumping what the theme now requires.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build site
        run: pnpm docs:build

      # The search box is patched, see pnpm.patchedDependencies in package.json: upstream
      # escapes a hyphen as \- inside a u-flag regex, which is a SyntaxError, so any query
      # with a hyphen ("e-bill") unmounted the whole search box. A pnpm that ignores the
      # patch config still installs and builds fine, so check the built bundle rather than
      # the config.
      - name: Check the search patch is applied
        run: |
          assets=docs/.vuepress/dist/assets
          if grep -qF -- 'replaceAll(/[-/\\^$*+?.()|[\]{}]/gu' "$assets"/*.js; then
            echo "::error::The built bundle contains the unpatched @vuepress/plugin-search escape regex, so the pnpm patch was not applied."
            exit 1
          fi
          if ! grep -qF -- 'replaceAll(/[/\\^$*+?.()|[\]{}]/gu' "$assets"/*.js; then
            echo "::error::The patched @vuepress/plugin-search escape regex is missing from the built bundle."
            exit 1
          fi
          echo "Search patch is applied."

      # A page holding nothing but a heading costs a reader a click to learn nothing.
      # The site was 139 such files before it was written; this keeps them from coming back.
      - name: Check for stub pages
        run: |
          stubs=$(find docs -name '*.md' -not -path '*/.vuepress/*' -size -100c)
          if [ -n "$stubs" ]; then
            echo "::error::Stub pages found (under 100 bytes — heading only):"
            echo "$stubs"
            exit 1
          fi
          echo "No stub pages."

      # Navigation is not automatic. A sidebar entry pointing at a file that does not
      # exist is a dead link in the nav of a live site.
      - name: Check sidebar entries resolve
        run: |
          missing=$(comm -13 \
            <(find docs -name '*.md' -not -path '*/.vuepress/*' | sed 's|^docs||' | sort -u) \
            <(grep -oE "'/[a-zA-Z0-9./-]+\.md'" docs/.vuepress/config.js | tr -d "'" | sort -u))
          if [ -n "$missing" ]; then
            echo "::error::Sidebar entries with no matching file:"
            echo "$missing"
            exit 1
          fi
          echo "Every sidebar entry resolves."
