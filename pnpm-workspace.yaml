# pnpm settings live here since pnpm 11; the pnpm field in package.json is ignored.

# pnpm 11 refuses to install while dependency build scripts are neither allowed nor denied.
# These packages ship prebuilt binaries as optional dependencies. Use those binaries
# without running install-time setup or fallback scripts.
allowBuilds:
  esbuild: false
  '@parcel/watcher': false
  workerd: false
